<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">World Script Explorer</title>
  <desc id="desc">A dark calligraphy pen writing Javanese script on a white page.</desc>
  <defs>
    <linearGradient id="penBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#51463b"/>
      <stop offset="1" stop-color="#211e1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ead18a"/>
      <stop offset="1" stop-color="#b68b2c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#34291e" flood-opacity=".14"/>
    </filter>
  </defs>

  <!-- White writing sheet -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#fff" stroke="#ddd6cc" stroke-width="1.4"/>
  <path d="M8 31.5H56 M8 43H39" stroke="#eee8df" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Javanese hanacaraka, with a font fallback for systems that provide Javanese support -->
  <text x="7" y="25.5" font-family="'Noto Sans Javanese','Noto Sans',serif" font-size="13.5" font-weight="600" fill="#2f2a24">ꦲꦤꦕꦫꦏ</text>

  <!-- Fresh ink flourish -->
  <path d="M8 34.5 C14 32.5 18 36.5 24 34.1 S33 32.6 36 35" fill="none" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Calligraphy pen, angled toward the writing -->
  <g filter="url(#shadow)" stroke-linejoin="round">
    <path d="M42.4 31.8 47.2 27.1 59 38.9 54.2 43.7Z" fill="url(#penBody)" stroke="#211e1a" stroke-width=".7"/>
    <path d="M45.1 29.2 47.4 27 59 38.7 56.7 41Z" fill="#6b5a47" opacity=".8"/>
    <path d="M42.3 31.9 54.1 43.7 45.1 49.8 38.3 42.9Z" fill="url(#penBody)" stroke="#211e1a" stroke-width=".8"/>
    <path d="M42.1 32.2 54 44 50.6 46.4 39.8 35Z" fill="url(#gold)" opacity=".96"/>
    <path d="M38.3 42.9 45.1 49.8 34.7 54.3Z" fill="#d9cbb6" stroke="#51463b" stroke-width=".8"/>
    <path d="M38.3 42.9 40.4 45.1 34.7 54.3Z" fill="#2f2a24"/>
    <circle cx="48.6" cy="36.6" r="1.15" fill="#f2dfad"/>
  </g>

  <!-- Ink dot at the nib -->
  <circle cx="34.5" cy="54.8" r="1.1" fill="#2f2a24"/>
</svg>
