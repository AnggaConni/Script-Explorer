name: Refresh public datasets

on:
  workflow_dispatch:
    inputs:
      unicode_version:
        description: "Use latest stable UCD, or pin an exact version such as 18.0.0"
        required: true
        default: "latest"
        type: string
  schedule:
    # Monthly check; the generated output is committed only when data changes.
    - cron: "17 4 1 * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "index.html"
      - "writing-practice.html"
      - "favicon.svg"
      - ".github/workflows/update-public-data.yml"

permissions:
  contents: write

concurrency:
  # New commits supersede stale builds; failed/cancelled builds never publish partial datasets.
  group: refresh-public-datasets-v2
  cancel-in-progress: true

jobs:
  refresh:
    name: Build and validate datasets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Syntax-check browser JavaScript
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          html_pages = ("index.html", "writing-practice.html")
          for filename in html_pages:
              html = Path(filename).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, flags=re.I | re.S)
              inline = "\n".join(script for script in scripts if script.strip())
              if not inline:
                  raise SystemExit(f"No inline JavaScript block was found in {filename}")
              output = Path(os.environ["RUNNER_TEMP"]) / filename.replace(".html", "-inline.js")
              output.write_text(inline, encoding="utf-8")
              print(f"Extracted inline JavaScript from {filename} to {output}")
          index_html = Path("index.html").read_text(encoding="utf-8")
          assert "Accept either GeoJSON ISO-3 (e.g. RUS) or ISO-2 (e.g. RU)." in index_html, "Country lookup must accept ISO-2 and ISO-3 codes"
          assert "getScriptData(iso2 || iso3)" in index_html, "Country panel must fall back to the ISO-3 code when needed"
          assert "openWritingPractice(script, fontFamily)" in index_html, "Writing practice button must pass selected script metadata"
          assert "block: script._block_id ||" in index_html, "Writing practice must receive a source block identifier"
          practice_html = Path("writing-practice.html").read_text(encoding="utf-8")
          for required in ("writingCanvas", "pointerdown", "pointermove", "Save PNG", "targetInput",
                           "sequenceMode", "characterPicker", "prevCharacterBtn", "nextCharacterBtn",
                           "makeCharacterDeck", "initializeSequence", "formatCodepoint"):
              assert required in practice_html, "Writing practice page is missing " + required
          PY
          node --check "$RUNNER_TEMP/index-inline.js"
          node --check "$RUNNER_TEMP/writing-practice-inline.js"

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Build datasets from public sources
        env:
          UNICODE_VERSION: ${{ github.event.inputs.unicode_version || 'latest' }}
        run: python scripts/build_datasets.py --unicode-version "$UNICODE_VERSION"

      - name: Validate generated dataset structure
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          app = json.loads(Path("aksara.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("data/source_manifest.json").read_text(encoding="utf-8"))
          languages = json.loads(Path("data/languages.json").read_text(encoding="utf-8"))
          relationships = json.loads(Path("data/script_relationships.json").read_text(encoding="utf-8"))
          practice_index = json.loads(Path("data/practice_character_index.json").read_text(encoding="utf-8"))

          definitions = app.get("definitions", {})
          countries = app.get("countries", {})
          crosswalk = app.get("iso3_to_iso2", {})
          assert app.get("metadata", {}).get("unicode_version"), "Unicode version metadata is missing"
          assert len(definitions) >= 100, f"Unexpectedly few Unicode blocks: {len(definitions)}"
          assert len(countries) >= 100, f"Unexpectedly few sourced country mappings: {len(countries)}"
          assert len(crosswalk) >= 200, f"Unexpectedly small ISO country-code crosswalk: {len(crosswalk)}"
          assert all(re.fullmatch(r"[A-Z]{2}", code) for code in countries), "Non-ISO-2 country key found"
          assert all(block_id in definitions for ids in countries.values() for block_id in ids), "Country mapping references an absent block"
          assert "ID" in countries, "Indonesia has no public-source writing-system links; check country-language sources"
          assert "basic_latin" in countries["ID"], "Indonesia should include the public-source Latin script relation"
          assert "javanese" in countries["ID"], "Indonesia should include its public-source Javanese script relation"
          assert languages.get("languages"), "Language dataset is empty"
          assert relationships.get("relationships"), "Script relationship dataset is empty"
          practice_blocks = practice_index.get("blocks", {})
          assert practice_index.get("metadata", {}).get("unicode_version") == app.get("metadata", {}).get("unicode_version"), "Practice index UCD version must match the app dataset"
          assert len(practice_blocks) == len(definitions), "Practice index must include every Unicode block"
          assert practice_blocks.get("basic_latin", {}).get("letters") == list(range(0x41, 0x5B)) + list(range(0x61, 0x7B)), "Basic Latin practice deck must include A-Z and a-z"
          assert Path("data/UNICODE-LICENSE.txt").is_file(), "Unicode license notice is missing"
          assert manifest.get("unicode_source", {}).get("files"), "Unicode source checksums are missing"
          print(f"Validated {len(definitions)} blocks, {len(countries)} countries, {len(crosswalk)} ISO codes, and {len(languages['languages'])} languages.")
          PY

      - name: Commit changes only when generated data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aksara.json data/
          if git diff --cached --quiet; then
            echo "Generated datasets are unchanged; nothing to commit."
          else
            git commit -m "chore(data): refresh Unicode and public relationships"
            git pull --rebase origin main
            git push
          fi
